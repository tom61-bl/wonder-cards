<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇遇卡牌 · 每天抽一个神奇网站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171334'/%3E%3Cpath d='M16 5l2.4 7.2L26 14l-7.6 1.8L16 23l-2.4-7.2L6 14l7.6-1.8z' fill='%23EBC57F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============ 基础与变量 ============ */
:root{
  --bg:#0E0B22; --bg2:#171334; --panel:#1E1940; --panel2:#251E4D;
  --ink:#F3EEE3; --ink2:#B7AFCF; --ink3:#847CA3;
  --gold:#EBC57F; --gold2:#D9A95E; --line:rgba(235,197,127,.28);
  --card-w:290px; --card-h:412px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Noto Sans SC',system-ui,sans-serif;
  color:var(--ink); background:var(--bg);
  overflow-x:hidden; min-height:100vh;
}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
/* 背景光晕 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 420px at 50% -8%, rgba(124,108,214,.28), transparent 70%),
    radial-gradient(500px 400px at 88% 108%, rgba(217,169,94,.12), transparent 70%),
    radial-gradient(500px 400px at 8% 100%, rgba(88,120,190,.14), transparent 70%);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{text-decoration:none;color:inherit}
.serif{font-family:'Noto Serif SC',serif}

/* ============ 顶部导航 ============ */
header{
  position:relative;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 26px; max-width:1180px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{width:34px;height:34px}
.brand h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:21px;letter-spacing:2px}
.brand small{display:block;font-size:10px;color:var(--ink3);letter-spacing:3px;font-weight:400;margin-top:1px}
nav{display:flex;gap:8px;background:rgba(30,25,64,.7);border:1px solid rgba(255,255,255,.07);
  padding:5px;border-radius:999px;backdrop-filter:blur(8px)}
nav button{
  padding:8px 17px;border-radius:999px;font-size:13.5px;color:var(--ink2);
  display:flex;align-items:center;gap:7px;transition:.25s;
}
nav button.active{background:var(--gold);color:#2A2008;font-weight:700}
nav button:not(.active):hover{color:var(--ink)}
.nav-count{font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:99px;min-width:20px;text-align:center}
nav button.active .nav-count{background:rgba(42,32,8,.25);color:#2A2008}

/* ============ 主区域 ============ */
main{position:relative;z-index:3;max-width:1180px;margin:0 auto;padding:10px 26px 60px}
.view{display:none}
.view.show{display:block;animation:viewIn .5s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 抽卡视图 */
.draw-hero{text-align:center;margin:18px 0 6px}
.draw-hero h2{font-family:'Noto Serif SC',serif;font-size:30px;font-weight:900;letter-spacing:3px}
.draw-hero p{color:var(--ink2);font-size:14px;margin-top:9px;letter-spacing:1px}
.draw-hero .daily-hint{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:12.5px;color:var(--gold);
  border:1px solid var(--line);padding:5px 14px;border-radius:99px;background:rgba(235,197,127,.07);
}

/* 牌桌 */
.table-wrap{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:34px}
.deck-stage{position:relative;width:var(--card-w);height:var(--card-h);perspective:1400px}
.stack{position:absolute;inset:0}
.stack .card-back{position:absolute;inset:0;transition:transform .5s ease,opacity .4s}
.stack .card-back:nth-child(1){transform:translate(-14px,10px) rotate(-7deg)}
.stack .card-back:nth-child(2){transform:translate(-7px,5px) rotate(-3deg)}
.stack .card-back:nth-child(3){transform:translate(0,0) rotate(0deg)}
.deck-stage.shuffling .stack .card-back:nth-child(1){animation:sh1 .35s ease}
.deck-stage.shuffling .stack .card-back:nth-child(2){animation:sh2 .35s ease}
.deck-stage.shuffling .stack .card-back:nth-child(3){animation:sh3 .35s ease}
@keyframes sh1{0%,100%{transform:translate(-14px,10px) rotate(-7deg)}50%{transform:translate(-30px,-6px) rotate(-14deg)}}
@keyframes sh2{0%,100%{transform:translate(-7px,5px) rotate(-3deg)}50%{transform:translate(10px,-12px) rotate(6deg)}}
@keyframes sh3{0%,100%{transform:none}50%{transform:translate(-4px,-16px) rotate(-5deg)}}

/* 牌背 */
.card-back{
  border-radius:16px;
  background:linear-gradient(160deg,#2B2360,#191438 70%);
  border:1px solid var(--line);
  box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 0 3px rgba(235,197,127,.08);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.card-back .seal{width:62%;height:62%;opacity:.85}
.card-back .frame{position:absolute;inset:9px;border:1px solid rgba(235,197,127,.25);border-radius:11px}

/* 抽出的牌（翻转） */
.drawn-card{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  opacity:0;pointer-events:none;
}
.drawn-card.rising{
  opacity:1;pointer-events:auto;
  animation:rise .4s cubic-bezier(.2,.9,.3,1.2) forwards;
}
@keyframes rise{from{transform:translateY(70px) scale(.8)}to{transform:translateY(0) scale(1)}}
.drawn-card.flipping{animation:flipUp .65s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes flipUp{
  0%{transform:translateY(0) rotateY(0)}
  55%{transform:translateY(-26px) rotateY(90deg)}
  100%{transform:translateY(0) rotateY(180deg)}
}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;overflow:hidden;
}
.face.back{transform:rotateY(180deg)}
.face.front{
  transform:rotateY(180deg);
  background:linear-gradient(170deg,#241E50,#161232 72%);
  border:1px solid var(--line);
  box-shadow:0 22px 50px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
}
.face.front .inner-frame{position:absolute;inset:8px;border:1px solid rgba(235,197,127,.22);border-radius:11px;pointer-events:none;z-index:4}

/* 牌正面内容 */
.card-art{height:158px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-art svg{width:104px;height:104px;position:relative;z-index:2;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.card-art .art-bg{position:absolute;inset:0}
.card-body{padding:14px 18px 12px;display:flex;flex-direction:column;flex:1}
.card-cat{font-size:11px;letter-spacing:2px;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.card-name{font-family:'Noto Serif SC',serif;font-weight:900;font-size:24px;margin-top:9px;line-height:1.25;letter-spacing:.5px}
.card-domain{font-size:11px;color:var(--ink3);margin-top:4px}
.card-desc{font-size:13px;color:var(--ink2);line-height:1.65;margin-top:9px}
.card-tip{font-size:11.5px;color:var(--gold);margin-top:8px;line-height:1.5;display:flex;gap:6px}
.card-tip b{font-weight:500}
.card-actions{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.btn{
  flex:1;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;
}
.btn-go{background:var(--gold);color:#2A2008}
.btn-go:hover{background:#f2d293}
.btn-fav{flex:0 0 44px;border:1px solid var(--line);color:var(--gold)}
.btn-fav:hover{background:rgba(235,197,127,.12)}
.btn-fav.saved{background:rgba(235,197,127,.16)}
.btn-fav svg{width:18px;height:18px}

/* 大抽卡按钮 */
.draw-btn{
  margin-top:40px;
  font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;letter-spacing:4px;
  color:#2A2008;background:linear-gradient(180deg,#F2D293,#D9A95E);
  padding:16px 52px;border-radius:99px;
  box-shadow:0 12px 30px rgba(217,169,94,.35), inset 0 1px 0 rgba(255,255,255,.5);
  transition:.2s;position:relative;
}
.draw-btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(217,169,94,.45)}
.draw-btn:active{transform:translateY(0)}
.draw-btn.secondary{font-size:14px;padding:12px 34px;letter-spacing:2px}
.draw-stats{margin-top:22px;font-size:12.5px;color:var(--ink3);letter-spacing:1px}
.draw-stats b{color:var(--gold);font-weight:500}

/* 粒子 */
#particles{position:fixed;inset:0;z-index:40;pointer-events:none}

/* ============ 收藏视图 ============ */
.fav-head{text-align:center;margin:14px 0 26px}
.fav-head h2{font-family:'Noto Serif SC',serif;font-size:27px;font-weight:900;letter-spacing:3px}
.fav-head p{color:var(--ink3);font-size:13px;margin-top:8px}
.fav-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;
}
.fav-card{
  border-radius:14px;overflow:hidden;position:relative;
  background:linear-gradient(170deg,#241E50,#161232);
  border:1px solid rgba(255,255,255,.09);
  transition:.25s;display:flex;flex-direction:column;
}
.fav-card:hover{transform:translateY(-4px);border-color:var(--line)}
.fav-card .card-art{height:118px}
.fav-card .card-art svg{width:68px;height:68px}
.fav-card .card-body{padding:12px 15px 14px}
.fav-card .card-name{font-size:18px;margin-top:7px}
.fav-card .card-desc{font-size:12px;margin-top:6px;line-height:1.55}
.fav-card .fcard-actions{display:flex;gap:8px;margin-top:11px}
.fav-card .btn{padding:8px 4px;font-size:12px}
.fav-card .btn-fav{flex:0 0 38px}
.empty{
  grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--ink3);
}
.empty svg{width:64px;height:64px;opacity:.4;margin-bottom:18px}
.empty p{font-size:14px;line-height:1.9}
.empty .go-draw{margin-top:22px;display:inline-block;padding:11px 30px;border-radius:99px;
  background:var(--gold);color:#2A2008;font-weight:700;font-size:13.5px}

/* toast */
#toast{
  position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(20px);
  background:rgba(30,25,64,.95);border:1px solid var(--line);color:var(--ink);
  padding:11px 22px;border-radius:99px;font-size:13px;z-index:60;
  opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 响应式 ============ */
@media (max-width:600px){
  :root{--card-w:78vw;--card-h:calc(78vw * 1.42)}
  header{padding:14px 16px}
  .brand h1{font-size:18px}
  nav button{padding:7px 12px;font-size:12.5px}
  main{padding:6px 14px 50px}
  .draw-hero h2{font-size:23px}
  .draw-hero p{font-size:12.5px}
  .draw-btn{padding:14px 40px;font-size:16px}
  .card-name{font-size:21px}
  .fav-grid{grid-template-columns:1fr 1fr;gap:13px}
  .fav-card .card-art{height:86px}
  .fav-card .card-art svg{width:50px;height:50px}
  .fav-card .card-desc{display:none}
  .fav-card .card-name{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<canvas id="particles"></canvas>

<header>
  <div class="brand">
    <svg viewBox="0 0 32 32"><path d="M16 4l2.5 7.5L26 14l-7.5 2.5L16 24l-2.5-7.5L6 14l7.5-2.5z" fill="#EBC57F"/><circle cx="16" cy="16" r="2.2" fill="#0E0B22"/></svg>
    <div><h1>奇遇卡牌</h1><small>WONDER CARDS</small></div>
  </div>
  <nav>
    <button id="navDraw" class="active">抽卡</button>
    <button id="navFav">收藏夹<span class="nav-count" id="favCount">0</span></button>
  </nav>
</header>

<main>
  <!-- ===== 视图：抽卡 ===== -->
  <section class="view show" id="viewDraw">
    <div class="draw-hero">
      <h2>每天抽一张，遇见一个神奇网站</h2>
      <p>世界上有无数有趣、好玩、脑洞大开的角落，抽一张，让命运替你挑一个</p>
      <div class="daily-hint" id="dailyHint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="dailyHintText">今天的命运之牌还没抽</span>
      </div>
    </div>

    <div class="table-wrap">
      <div class="deck-stage" id="deckStage">
        <div class="stack" id="stack">
          <div class="card-back"><div class="frame"></div>CARD_BACK_SEAL</div>
          <div class="card-back"><div class="frame"></div>CARD_BACK_SEAL</div>
          <div class="card-back"><div class="frame"></div>CARD_BACK_SEAL</div>
        </div>
        <div class="drawn-card" id="drawnCard">
          <div class="face back">CARD_BACK_SEAL</div>
          <div class="face front" id="cardFront"></div>
        </div>
      </div>
      <button class="draw-btn" id="drawBtn">抽 取 卡 牌</button>
      <div class="draw-stats">牌库共 <b id="totalCount">0</b> 张 · 你已抽过 <b id="drawnCount">0</b> 张 · 收藏 <b id="favCount2">0</b> 张</div>
    </div>
  </section>

  <!-- ===== 视图：收藏夹 ===== -->
  <section class="view" id="viewFav">
    <div class="fav-head">
      <h2>我的收藏</h2>
      <p>抽到时心动的网站，都安放在这里</p>
    </div>
    <div class="fav-grid" id="favGrid"></div>
  </section>
</main>

<div id="toast"></div>

<script>
/* ============ 牌库数据 ============ */
const CATS = [
  {key:'sound', name:'世界之声', color:'#6FC6D9'},
  {key:'art',   name:'视觉玩具', color:'#D076BC'},
  {key:'fun',   name:'奇趣实验', color:'#E0A24F'},
  {key:'game',  name:'沉浸游戏', color:'#7BC48F'},
  {key:'space', name:'宇宙地球', color:'#8B96E8'},
  {key:'know',  name:'知识可视', color:'#E3C46B'},
  {key:'heal',  name:'治愈氛围', color:'#E39FB0'},
  {key:'make',  name:'创造工具', color:'#65C3B0'},
];
const SITES = [
  // [名称, 网址, 类别索引, 描述, 玩法提示]
  // 世界之声
  ['Radio Garden','https://radio.garden/',0,'转动一只悬浮的地球，把小绿点落到任何城市，立刻听到当地正在直播的电台。','深夜把地球转到冰岛或印度，听一听地球另一端此刻的声音。'],
  ['Radiooooo','https://radiooooo.com/',0,'在世界地图上选一个国家、一个年代，就能听到那个年代那个地方的人在听什么。','选 1960 年代的巴西，像翻开一张声音老照片。'],
  ['Radio Aporee','https://aporee.org/radiomap/',0,'全球田野录音地图：街头、集市、雨林、港口，有人把那里的声音录下来钉在地图上。','点开南美洲的雨林，闭眼就像站在那里。'],
  ['Nature Sound Map','https://naturesoundmap.com/',0,'自然声音地图，从北极冰川到澳洲丛林，标满了动物、风和流水的真实录音。','想静一静的时候，随便点开海里的一个点。'],
  ['Earth.fm','https://earth.fm/',0,'纯粹的自然声景播放器，每个录音都来自地球上真实的生态角落。','戴上耳机，五分钟像去野外走了一趟。'],
  ['Xeno-canto','https://xeno-canto.org/',0,'全球鸟鸣数据库，在地图上点开任何区域，就能听到当地野鸟的叫声。','想知道某种鸟怎么叫，来这里查。'],
  ['Every Noise at Once','https://everynoise.com/',0,'一张由上千个音乐流派组成的声谱图，每个小点都是一种音乐风格。','顺着小点一路点下去，会发现自己没听过的世界。'],
  ['Musicmap','https://musicmap.info/',0,'流行音乐的流派家谱，从爵士到电子，清楚画出每种风格的血缘与演变。','喜欢音乐的人能在这张图上泡一下午。'],
  ['WhoSampled','https://www.whosampled.com/',0,'输入任何一首歌，看它采样了谁、又被谁采样，像查音乐的族谱。','搜你喜欢的歌，往往能挖到一堆宝藏。'],
  // 视觉玩具
  ['Patatap','https://patatap.com/',1,'随便敲键盘，屏幕上会炸开流动的图形，同时响起清脆的声音。','闭眼乱敲，每一下都是一次小型烟花。'],
  ['Weave Silk','https://weavesilk.com/',1,'拖动鼠标，指尖会拖出对称、流动的光丝，像在编织会发光的纱。','随便画几笔都很美，很难画丑。'],
  ['Bomomo','https://bomomo.com/',1,'二十多种古怪的画笔，每一种都会自己生长、流动、旋转。','挨个试一遍，像在做视觉实验。'],
  ['JacksonPollock','https://www.jacksonpollock.org/',1,'在白色画布上点击、移动，泼出一幅波洛克式的行动绘画。','鼠标点到哪，颜料溅到哪。'],
  ['This Is Sand','https://thisissand.com/',1,'按一下就落下一小堆彩色沙子，一层层堆出一幅沙画。','极其简单，又莫名让人停不下来。'],
  ['流体粒子模拟','https://paveldogreat.github.io/WebGL-Fluid-Simulation/',1,'手指划过，彩色的流体被搅动、晕开、飞溅，物理效果真实得惊人。','用手机触屏划动，手感最惊艳。'],
  ['Zoom Quilt','https://zoomquilt.org/',1,'一幅可以无限放大的画，每往里钻一层，又是一幅新的画。','不停放大，像掉进了兔子洞。'],
  ['Shadertoy','https://www.shadertoy.com/',1,'程序员用代码画出的实时视觉世界，光影、星云、水面全靠数学生成。','按 Shuffle 随机看，每一个都像科幻片。'],
  ['Chrome Experiments','https://experiments.withgoogle.com/collection/chrome',1,'谷歌收集的网页创意实验合集，网页能做到的事都在这里。','挑浏览量高的点，几乎不会失望。'],
  ['Orb.Farm','https://orb.farm/',1,'一颗玻璃球里的微型生态：放水草、小鱼、细菌，看它们自己运转。','养一个属于自己的小小世界。'],
  // 奇趣实验
  ['Pointer Pointer','https://pointerpointer.com/',2,'鼠标停在哪儿，就出现一张有人用手指着你那个位置的照片。','把鼠标放在角落试试，它真的指得到。'],
  ['The Useless Web','https://theuselessweb.com/',2,'按下按钮，它会把你随机送到一个毫无用处但极其有趣的网站。','无聊时按一下，是互联网的扭蛋机。'],
  ['Endless Horse','https://endless.horse/',2,'一匹长得没有尽头的马，你往下滚，它就一直长。','到底能滚多久？自己试试。'],
  ['Find the Invisible Cow','https://findtheinvisiblecow.com/',2,'看不见的牛藏在屏幕里，靠声音大小判断它在哪，点中就牛叫。','戴上耳机，声音越大离牛越近。'],

/* ============ 状态 ============ */
const STORE_KEY = 'wonderCards_v1';
let state = { fav:[], drawn:[], dailyDate:'', dailyId:null };
try{ Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY))||{}); }catch(e){}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function seededPick(seed){
  let h=0; for(let i=0;i<seed.length;i++){ h=(h*31 + seed.charCodeAt(i))>>>0; }
  return h % SITES.length;
}
let busy=false, currentId=null;

}

/* ============ 抽卡流程 ============ */
const stage = document.getElementById('deckStage');
const drawnCard = document.getElementById('drawnCard');
const cardFront = document.getElementById('cardFront');
const drawBtn = document.getElementById('drawBtn');

function pickNext(){
  const tk = todayKey();
  if(state.dailyDate !== tk){
    state.dailyDate = tk;
    state.dailyId = seededPick(tk);
    if(!state.drawn.includes(state.dailyId)) state.drawn.push(state.dailyId);
    save();
    return {id:state.dailyId, daily:true};
  }
  let pool = SITES.map((_,i)=>i).filter(i=>!state.drawn.includes(i));
  if(pool.length===0){ state.drawn = []; pool = SITES.map((_,i)=>i); }
  const id = pool[Math.floor(Math.random()*pool.length)];
  state.drawn.push(id);
  save();
  return {id, daily:false};
}

function draw(){
  if(busy) return;
  busy = true;
  drawBtn.style.visibility = 'hidden';
  drawnCard.className = 'drawn-card';
  drawnCard.style.opacity = '0';
  stage.classList.add('shuffling');
  setTimeout(()=>stage.classList.remove('shuffling'), 400);
  const picked = pickNext();
  currentId = picked.id;
  setTimeout(()=>{
    cardFront.innerHTML = cardFrontHTML(SITES[picked.id]);
    drawnCard.style.opacity = '';
    drawnCard.classList.add('rising');
    burstAt(stage);
  }, 280);
  setTimeout(()=>{ drawnCard.classList.add('flipping'); }, 680);
  setTimeout(()=>{
    busy=false;
    drawBtn.textContent = '再 抽 一 张';
    drawBtn.style.visibility = '';
    refreshStats();
    updateDailyHint();
  }, 1300);
}
drawBtn.addEventListener('click', draw);

/* ============ 收藏操作 ============ */
function toggleFav(id){
  const i = state.fav.indexOf(id);
  if(i>=0){ state.fav.splice(i,1); toast('已取消收藏'); }
  else{ state.fav.push(id); toast('已加入收藏夹'); }
  save();
  if(currentId===id){
    const b = drawnCard.querySelector('[data-fav]');
    if(b){ b.classList.toggle('saved', state.fav.includes(id)); b.innerHTML = FAV_ICON(state.fav.includes(id)); }
  }
  refreshStats();
  renderFav();
}
document.addEventListener('click', e=>{
  const f = e.target.closest('[data-fav]');
  if(f){ toggleFav(+f.dataset.fav); }
});

function refreshStats(){
  document.getElementById('totalCount').textContent = SITES.length;
  document.getElementById('drawnCount').textContent = state.drawn.length;
  document.getElementById('favCount').textContent = state.fav.length;
  document.getElementById('favCount2').textContent = state.fav.length;
}
function updateDailyHint(){
  const el = document.getElementById('dailyHintText');
  if(state.dailyDate===todayKey()){
    el.textContent = '今日命运之牌：' + SITES[state.dailyId].name;
  }else{ el.textContent = '今天的命运之牌还没抽'; }
}

      <div class="card-art" style="color:${cat.color}">
        <div class="art-bg" style="background:radial-gradient(circle at 50% 42%, ${cat.color}33, transparent 70%)"></div>
        <svg viewBox="0 0 100 100">${ART_SVG[s.cat]}</svg>
      </div>
      <div class="card-body">
        <span class="card-cat" style="color:${cat.color};font-size:10px">${cat.name}</span>
        <div class="card-name">${s.name}</div>
        <div class="card-desc">${s.desc}</div>
        <div class="fcard-actions">
          <a class="btn btn-go" href="${s.url}" target="_blank" rel="noopener">前往</a>
          <button class="btn-fav" data-fav="${s.id}">${FAV_ICON(true)}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ============ 视图切换 ============ */
function switchView(v){
  document.getElementById('viewDraw').classList.toggle('show', v==='draw');
  document.getElementById('viewFav').classList.toggle('show', v==='fav');
  document.getElementById('navDraw').classList.toggle('active', v==='draw');
  document.getElementById('navFav').classList.toggle('active', v==='fav');
  if(v==='fav') renderFav();
}
document.getElementById('navDraw').addEventListener('click',()=>switchView('draw'));
document.getElementById('navFav').addEventListener('click',()=>switchView('fav'));

/* ============ toast ============ */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============ 星空背景 ============ */
(function(){
  const cv = document.getElementById('starfield'), ctx = cv.getContext('2d');
  let stars = [];
  function resize(){
    cv.width = innerWidth; cv.height = innerHeight;
    stars = [];
    const n = Math.floor(innerWidth*innerHeight/9000);
    for(let i=0;i<n;i++){
      stars.push({x:Math.random()*cv.width, y:Math.random()*cv.height,
        r:Math.random()*1.3+.2, p:Math.random()*Math.PI*2, s:Math.random()*.015+.004});
    }
  }
  resize(); addEventListener('resize', resize);
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const st of stars){
      st.p += st.s;
      const a = .25 + Math.abs(Math.sin(st.p))*.7;
      ctx.globalAlpha = a;
      ctx.fillStyle = st.r>1.1 ? '#EBC57F' : '#CFC6F0';
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
})();

/* ============ 抽卡粒子 ============ */
const pCV = document.getElementById('particles'), pCtx = pCV.getContext('2d');
let parts = [];
function burstAt(el){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<46;i++){
    const a = Math.random()*Math.PI*2, sp = Math.random()*5+1.5;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,
      life:1, size:Math.random()*2.6+1, gold:Math.random()>.3});
  }
}
(function loop(){
  pCV.width = innerWidth; pCV.height = innerHeight;
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += .08; p.life -= .018;
    pCtx.globalAlpha = Math.max(p.life,0);
    pCtx.fillStyle = p.gold ? '#EBC57F' : '#B9B0E8';
    pCtx.beginPath(); pCtx.arc(p.x,p.y,p.size,0,Math.PI*2); pCtx.fill();
  }
  pCtx.globalAlpha = 1;
  requestAnimationFrame(loop);
})();

/* ============ 初始化 ============ */
refreshStats();
updateDailyHint();
</script>
